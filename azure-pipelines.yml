# PHP as Linux Web App on Azure
# Build, package and deploy your PHP project to Azure Linux Web App.

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: 'a37edc60-eedb-49d5-aeee-db226d5b8241'

  # Web app name
  webAppName: 'stellarPrivateNotesApiProd'

  # Agent VM image name
  vmImageName: 'ubuntu-24.04'

  # Environment name
  environmentName: 'stellarPrivateNotesApiProd'

  # Root folder under which your composer.json file is available.
  rootFolder: $(System.DefaultWorkingDirectory)

stages:
- stage: Build
  displayName: Build stage
  variables:
    phpVersion: '8.3'
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        set -eu
        actual_php=$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')
        if [ "$actual_php" != "$(phpVersion)" ]; then
          echo "Expected PHP $(phpVersion), found $actual_php" >&2
          exit 1
        fi
        php -version
      workingDirectory: $(rootFolder)
      displayName: 'Verify installed PHP version $(phpVersion)'

    - script: |
        set -e
        php tests/controller-contract.php
        php tests/known-notes-contract.php
        php tests/security-contract.php
      displayName: 'Check legacy compatibility and conflict contracts'

    - script: composer install --no-dev --no-scripts --no-plugins --no-interaction --prefer-dist --optimize-autoloader
      workingDirectory: $(rootFolder)
      displayName: 'Composer install'

    - script: |
        set -eu
        composer check-platform-reqs --no-dev --no-plugins --no-scripts
        env -i PATH="$PATH" TMPDIR="$(Agent.TempDirectory)" STELLAR_RUNTIME_TEST=1 php tests/runtime-compatibility.php
      workingDirectory: $(rootFolder)
      displayName: 'Test real Laravel runtime with isolated synthetic data'

    - script: |
        set -eu
        mkdir -p "$(Build.ArtifactStagingDirectory)/app"
        for path in app artisan bootstrap config database default public resources routes vendor composer.json composer.lock; do
          if [ -e "$path" ]; then
            rsync -a --exclude='.git' --exclude='.env*' --exclude='auth.json' \
              --exclude='*.[mM][dD]' --exclude='OPERATIONS.txt' \
              --exclude='*.key' --exclude='*.pem' --exclude='*.sqlite' \
              --exclude='hot' --exclude='storage' \
              "$path" "$(Build.ArtifactStagingDirectory)/app/"
          fi
        done
        mkdir -p "$(Build.ArtifactStagingDirectory)/app/storage/framework/cache/data" \
          "$(Build.ArtifactStagingDirectory)/app/storage/framework/sessions" \
          "$(Build.ArtifactStagingDirectory)/app/storage/framework/views" \
          "$(Build.ArtifactStagingDirectory)/app/storage/logs"
      workingDirectory: $(rootFolder)
      displayName: 'Stage application files without repository metadata or local secrets'

    - script: php tests/prepare-linux-artifact.php "$(Build.ArtifactStagingDirectory)/app"
      workingDirectory: $(rootFolder)
      displayName: 'Verify the production-only Linux deployment artifact'

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - upload: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureRmWebAppDeployment@4
            displayName: 'Deploy Azure Web App'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              WebAppName: '$(webAppName)'
              packageForLinux: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              # The additive edit_session migration was applied and verified in
              # the PHP app container. Kudu is a separate container without PHP.
